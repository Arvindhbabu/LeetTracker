services:
  - type: web
    name: leettracker-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leettracker-db
          property: connectionString
      - key: SYNC_WORKERS
        value: "8"
      - key: REQUEST_TIMEOUT
        value: "12"
      - key: MAX_RETRIES
        value: "3"

  - type: cron
    name: leettracker-sync
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python sync_job.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leettracker-db
          property: connectionString
      - key: SYNC_WORKERS
        value: "8"
      - key: REQUEST_TIMEOUT
        value: "12"
      - key: MAX_RETRIES
        value: "3"

  - type: web
    name: leettracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: leettracker-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: leettracker-db
    plan: basic-256mb
    region: singapore
    databaseName: leettracker
    user: leettracker
